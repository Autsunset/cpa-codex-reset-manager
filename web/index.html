<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex 额度管家</title>
<link rel="icon" type="image/png" href="/v0/resource/plugins/cpa-codex-reset-manager/logo.png">
<script>try{const t=localStorage.getItem('ccrm-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch{}</script>
<link rel="stylesheet" href="/v0/resource/plugins/cpa-codex-reset-manager/style.css">
<script defer src="/v0/resource/plugins/cpa-codex-reset-manager/app.js"></script></head>
<body><main>
<header><div class="brand"><img src="/v0/resource/plugins/cpa-codex-reset-manager/logo.png" alt="" width="64" height="64"><div><h1 data-i18n="product">Codex 额度管家</h1><p class="muted" data-i18n="subtitle">看清余量，把握重置时机</p></div></div>
<div class="preferences"><div class="segmented" role="group" data-i18n-aria="languageLabel"><button type="button" data-language="zh-CN" lang="zh-CN">中文</button><button type="button" data-language="en" lang="en">English</button></div><div class="segmented" role="group" data-i18n-aria="themeLabel"><button type="button" data-theme-mode="auto" data-i18n="themeAuto">自动</button><button type="button" data-theme-mode="light" data-i18n="themeLight">浅色</button><button type="button" data-theme-mode="dark" data-i18n="themeDark">深色</button></div><div class="connection-actions"><span id="version"></span><button id="forget" type="button" hidden data-i18n="forget">忘记密钥</button></div></div></header>
<section id="login"><h2 data-i18n="connectTitle">连接额度管家</h2><p class="muted" data-i18n="connectDescription">输入 CPA 管理密钥，查看额度与重置设置。</p><form id="connect" onsubmit="return false"><label><span data-i18n="managementKey">管理密钥</span><input id="key" type="password" required autocomplete="current-password"></label><label><input id="rememberKey" type="checkbox"><span data-i18n="rememberKey">在此浏览器记住密钥</span></label><p class="muted" data-i18n="rememberHint">共享设备请勿勾选；未勾选时只保留在当前标签页。</p><button class="primary" data-i18n="connect">连接</button></form></section>
<p id="feedback" class="status" role="status" aria-live="polite"></p>
<div id="app" hidden>
<section><h2 data-i18n="settingsTitle">持久设置</h2><p class="muted" data-i18n="policyHint">新账号默认关闭。周额度耗尽时可兑换一张，每七天最多一次；到期兑换独立启用。兑换会重置额度窗口。</p>
<form id="settings" onsubmit="return false"><label><span data-i18n="pollLabel">巡检间隔（分钟）</span><input id="poll" type="number" min="1" max="60" required></label><label><span data-i18n="leadLabel">到期前兑换（分钟）</span><input id="lead" type="number" min="2" max="1440" required></label><label><span data-i18n="reminderLabel">提前提醒（小时）</span><input id="remind" type="number" min="1" max="168" required></label><p class="muted" data-i18n="scheduleHint">兑换提前量至少为巡检间隔的两倍。提醒依赖实测额度变化，不会生成模型请求。</p>
<div id="policies"></div><div class="toolbar"><button class="primary" id="save" data-i18n="save">保存设置</button><button type="button" id="refresh" data-i18n="refresh">刷新</button><button type="button" id="check" data-i18n="check">立即巡检</button><button type="button" id="notify" data-i18n="notify">启用浏览器提醒</button></div></form><p id="storage" class="muted"></p></section>
<h2 data-i18n="noticesTitle">当前提醒</h2><p class="muted" data-i18n="notificationHint">浏览器通知需要此页面保持打开；后台兑换不依赖页面。</p><div id="notices"></div>
<h2 data-i18n="accountsTitle">账号状态</h2><div class="grid" id="accounts"></div><section><h2 data-i18n="activityTitle">操作记录</h2><div id="events"></div></section>
</div></main></body></html>
